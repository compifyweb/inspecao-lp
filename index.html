<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; base-uri 'none'; form-action 'none'" />
    <meta name="theme-color" content="#f0f2f5" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Registro de inspeções de líquido penetrante e relatório do turno." />
    <title>Inspeção LP</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/telas.css" />
  </head>
  <body>
    <main id="app"></main>
    <div id="dock" class="dock" hidden>
      <div id="dock-acao" class="dock-acao" hidden></div>
      <nav id="nav" class="nav" aria-label="Principal" hidden></nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialogo" class="dialogo"></dialog>
    <input id="foto-camera" type="file" accept="image/*" capture="environment" hidden />
    <input id="foto-galeria" type="file" accept="image/*" multiple hidden />
    <script type="module" src="js/app.js"></script>
  </body>
</html>
